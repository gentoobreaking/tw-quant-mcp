# Release：推送 v* tag 時觸發——測試 → 多平台交叉編譯 → checksums → GitHub Release。
#
# 用法：
#   git tag v2.1.0 && git push origin v2.1.0
#
# 版本號注入：ldflags -X main.version=<tag>（與 Makefile VERSION 機制一致）。
# 產物命名：tw-quant-mcp_<tag>_<OS>_<ARCH>[.exe]，tar.gz（Windows 為 zip）。
---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test（發布前守門）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Compile（CGO_ENABLED=0，版本號 = tag）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${TAG}" \
            -o "dist/tw-quant-mcp_${TAG}_${GOOS}_${GOARCH}${EXT}" \
            ./cmd/mcp-server

      - name: Pack
        env:
          GOOS: ${{ matrix.goos }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          NAME="tw-quant-mcp_${TAG}_${GOOS}_${{ matrix.goarch }}"
          if [ "$GOOS" = "windows" ]; then
            zip "${NAME}.zip" "${NAME}.exe"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            rm -f "${NAME}"
          fi

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Checksums（SHA256）
        working-directory: dist
        run: sha256sum * > checksums.txt

      # 以 Runner 內建 gh CLI 發佈（第一方工具，免第三方 action）；
      # 輸出同時存入 /tmp/release.log，失敗時以 artifact 帶出（log 端點不可靠）
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            ls -la dist/
            gh auth status || true
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
              echo "MODE=upload（release 已存在，僅補附件）"
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                dist/tw-quant-mcp_${TAG}_*.tar.gz \
                dist/tw-quant-mcp_${TAG}_*.zip \
                dist/checksums.txt
            else
              echo "MODE=create"
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "tw-quant-mcp $TAG" \
                --generate-notes \
                dist/tw-quant-mcp_${TAG}_*.tar.gz \
                dist/tw-quant-mcp_${TAG}_*.zip \
                dist/checksums.txt
            fi
          } 2>&1 | tee /tmp/release.log
          exit ${PIPESTATUS[0]}

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics
          path: /tmp/release.log
