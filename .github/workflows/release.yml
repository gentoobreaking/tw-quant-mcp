# Release：推送 v* tag 時觸發——測試 → 多平台交叉編譯 → checksums → GitHub Release
# → 自動更新 Homebrew tap（需 TAP_TOKEN secret，未設定則跳過）。
#
# 用法：
#   git tag v2.1.0 && git push origin v2.1.0
#   或 Actions 頁面手動 Run workflow（重跑發佈/tap 更新）
#
# 版本號注入：ldflags -X main.version=<tag>（與 Makefile VERSION 機制一致）。
---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test（發布前守門）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Compile（CGO_ENABLED=0，版本號 = tag）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${TAG}" \
            -o "dist/tw-quant-mcp_${TAG}_${GOOS}_${GOARCH}${EXT}" \
            ./cmd/mcp-server

      - name: Pack
        env:
          GOOS: ${{ matrix.goos }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          NAME="tw-quant-mcp_${TAG}_${GOOS}_${{ matrix.goarch }}"
          if [ "$GOOS" = "windows" ]; then
            zip "${NAME}.zip" "${NAME}.exe"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            rm -f "${NAME}"
          fi

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Checksums（SHA256）
        working-directory: dist
        run: sha256sum * > checksums.txt

      # 以 Runner 內建 gh CLI 發佈；輸出存 /tmp/release.log，
      # 失敗時以 artifact 帶出（log 下載端點不可靠）
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            ls -la dist/
            gh auth status || true
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
              echo "MODE=upload（release 已存在，僅補附件）"
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                dist/tw-quant-mcp_${TAG}_*.tar.gz \
                dist/tw-quant-mcp_${TAG}_*.zip \
                dist/checksums.txt
            else
              echo "MODE=create"
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "tw-quant-mcp $TAG" \
                --generate-notes \
                dist/tw-quant-mcp_${TAG}_*.tar.gz \
                dist/tw-quant-mcp_${TAG}_*.zip \
                dist/checksums.txt
            fi
          } 2>&1 | tee /tmp/release.log
          exit ${PIPESTATUS[0]}

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics
          path: /tmp/release.log

  homebrew-tap:
    name: Update Homebrew tap
    needs: release
    if: >-
      ${{
        !cancelled() && (
          github.event_name == 'workflow_dispatch' ||
          needs.release.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate formula & push to tap repo
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            if [ -z "$TAP_TOKEN" ]; then
              echo "::notice::TAP_TOKEN 未設定，跳過 Homebrew tap 更新"
              exit 0
            fi
            # 手動觸發時 ref 為分支名，改取最新 GitHub Release 的 tag
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                --jq .tag_name)
              echo "dispatch 模式：使用最新 release tag $TAG"
            fi
            VERSION="${TAG#v}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              -p checksums.txt -O checksums.txt
            bash scripts/gen_formula.sh "$VERSION" checksums.txt \
              formula_out/Formula/tw-quant-mcp.rb
          TAP_URL="https://x-access-token:${TAP_TOKEN}"
          TAP_URL="${TAP_URL}@github.com/${OWNER}/homebrew-tap.git"
          git clone --depth 1 "$TAP_URL" tap
          mkdir -p tap/Formula
          cp formula_out/Formula/tw-quant-mcp.rb tap/Formula/tw-quant-mcp.rb
          cd tap
          git config user.name "tw-quant-mcp release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/tw-quant-mcp.rb
          if git diff --cached --quiet; then
            echo "::notice::tap 已是最新版本 ${VERSION}"
          else
            git commit -m "tw-quant-mcp ${VERSION}"
            git push origin HEAD
            echo "::notice::homebrew-tap 已更新至 ${VERSION}"
          fi
          } 2>&1 | tee /tmp/tap.log
          RC=${PIPESTATUS[0]}
          # 失敗時將完整 log 推到 tap repo 的 ci-debug 分支（log 端點不可靠時的診斷通道）
          if [ "$RC" -ne 0 ] && [ -d tap ]; then
            (
              cd tap
              git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
              cp /tmp/tap.log DEBUG-ci.md
              git config user.name "tw-quant-mcp release bot"
              git config user.email "actions@users.noreply.github.com"
              git add DEBUG-ci.md
              git commit -m "ci debug log $(date -u +%FT%TZ)"
              git push -f origin ci-debug
            ) || true
          fi
          exit $RC

      - name: Upload tap failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tap-diagnostics
          path: /tmp/tap.log
