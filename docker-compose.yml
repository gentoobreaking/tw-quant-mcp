services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tw-quant-mcp
    ports:
      - 8000:8000
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HTTP_ADDR=0.0.0.0:8000
      - LOG_LEVEL=INFO
      - TZ=Asia/Taipei
      - DATA_DIR=/app/data
      - SYMBOL_REGISTRY_OVERRIDE=/app/data/manual_overrides.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "curl -f -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1.0\"}}}' http://localhost:8000"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - tw-quant-network

networks:
  tw-quant-network:
    driver: bridge
