services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tw-quant-mcp
    ports:
      - 8000:8000
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HTTP_ADDR=0.0.0.0:8000
      - LOG_LEVEL=INFO
      - TZ=Asia/Taipei
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tw-quant-network

networks:
  tw-quant-network:
    driver: bridge
